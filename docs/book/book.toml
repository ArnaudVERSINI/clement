[book]
title = "Clement - Documentation"
authors = ["Arnaud VERSINI"]
src = "src"
language = "fr"

[output.html]
mathjax-support = false
additional-css = []

[output.html.search]
limit-results = 20
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1

[output.html.playground]
editable = true
line-numbers = true

[output.html.print]
enable = true

[output.epub]
optional = true

[build]
build-dir = "../book-output"
